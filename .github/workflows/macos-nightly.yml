name: macos-nightly

on:
  push:
    branches:
      - main

concurrency:
  group: macos-nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-nightly:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    runs-on: macos-latest
    env:
      ENABLE_APPLE_SIGNING: ${{ vars.ENABLE_APPLE_SIGNING == 'true' && 'true' || 'false' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Restore App Store Connect key
        if: ${{ env.ENABLE_APPLE_SIGNING == 'true' && secrets.APPLE_API_KEY_CONTENT != '' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - uses: tauri-apps/tauri-action@action-v0.6.0
        if: ${{ env.ENABLE_APPLE_SIGNING == 'true' }}
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: nightly
          releaseName: BS Tools Nightly
          releaseBody: Rolling macOS build from the main branch.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles app,dmg

      - uses: tauri-apps/tauri-action@action-v0.6.0
        if: ${{ env.ENABLE_APPLE_SIGNING != 'true' }}
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: nightly
          releaseName: BS Tools Nightly
          releaseBody: Rolling macOS build from the main branch.
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles app,dmg
